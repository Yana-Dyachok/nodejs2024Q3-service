services:
  database:
    build:
      context: .
      dockerfile: ./postgre-sql-db/Dockerfile
    restart: always
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - ${PORT}:${PORT}
    env_file:
      - .env
    depends_on:
      - database 
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - app-network  

volumes:
  pgdata: {} 

networks:
  app-network:
    driver: bridge

