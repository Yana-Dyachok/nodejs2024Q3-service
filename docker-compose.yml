services:
  database:
    image: postgres:17
    build:
      context: .
      dockerfile: ./postgre-sql-db/Dockerfile
    restart: always
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-h", "database", "-p", "${POSTGRES_PORT}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - "${PORT}:${PORT}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - node_modules:/app/node_modules
      - logs_data:/app/logs
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync+restart
          path: ./config
          target: /app/config
          ignore:
            - node_modules/

volumes:
  pgdata: {}
  node_modules: {}
  logs_data: {}

networks:
  app-network:
    driver: bridge